# Сборка без Mac: GitHub Actions (macOS 26, Xcode 26.6). Задачи параллельно — время прогона равно самой долгой:
#   screens — модульные тесты и снимки всех экранов на iPhone 17 Pro;
#   player  — встроенный TorrServer и mpv на свободном фильме, поворот плеера;
#   ipa     — неподписанный Aerial.ipa для установки через Sideloadly/AltStore;
#   ipad    — снимки ключевых экранов на iPad Pro 11" — только по запросу (Run workflow → ipad).
# Симулятор грузится только после сборки: в фоне он отнимал процессор и диск, и пакеты со сборкой шли в 5–10 раз дольше.
# Артефакты: Aerial-ipa, Aerial-check-<задача> (снимки screens/, журналы logs/).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ipad:
        description: Снимки экранов на iPad
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: ${{ matrix.part }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # В strategy недоступен env — состав задач строкой JSON; iPad — только при запуске вручную с галочкой.
        include: >-
          ${{ fromJSON(inputs.ipad
            && '[{"part":"screens","device":"iPhone 17 Pro","only":"-only-testing:AerialTests -only-testing:AerialUITests/ScreensTests/testScreens"},{"part":"player","device":"iPhone 17 Pro","only":"-only-testing:AerialUITests/ScreensTests/testPlaybackSmoke"},{"part":"ipa","device":"","only":""},{"part":"ipad","device":"iPad Pro 11-inch (M5)","only":"-only-testing:AerialUITests/ScreensTests/testTabletScreens"}]'
            || '[{"part":"screens","device":"iPhone 17 Pro","only":"-only-testing:AerialTests -only-testing:AerialUITests/ScreensTests/testScreens"},{"part":"player","device":"iPhone 17 Pro","only":"-only-testing:AerialUITests/ScreensTests/testPlaybackSmoke"},{"part":"ipa","device":"","only":""}]') }}
    env:
      PART: ${{ matrix.part }}
      DEVICE: ${{ matrix.device }}
      ONLY: ${{ matrix.only }}
      SIM_OS: "26.5"
      PACKAGES: ${{ github.workspace }}/.build/SourcePackages
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          mkdir -p out/screens out/logs
          if [ -n "$DEVICE" ]; then
            udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in d.items() if k.endswith('iOS-' + os.environ['SIM_OS'].replace('.','-')) for x in v if x['name']==os.environ['DEVICE']), ''))")
            echo "UDID=$udid" >> "$GITHUB_ENV"
          fi

      - name: Проект
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          printf 'TMDB_API_KEY = %s\nTMDB_READ_TOKEN = %s\n' "$TMDB_API_KEY" "$TMDB_READ_TOKEN" > Config/Secrets.xcconfig
          # Готовая сборка XcodeGen из релиза — секунды; brew install шёл 2–3 минуты.
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate

      # Кэша пакетов нет намеренно: с GitHub они качаются за ~40 с, а кэш (1 ГБ) при четырёх задачах сразу
      # восстанавливался по 3–4 минуты.
      - name: Пакеты (MPVKit, TorrServerKit)
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project Aerial.xcodeproj -scheme Aerial \
            -clonedSourcePackagesDirPath "$PACKAGES" 2>&1 | tee out/logs/packages.log | tail -20

      - name: Сборка для тестов
        if: matrix.part != 'ipa'
        run: |
          set +e
          xcodebuild build-for-testing -project Aerial.xcodeproj -scheme Aerial \
            -destination "platform=iOS Simulator,id=$UDID" \
            -clonedSourcePackagesDirPath "$PACKAGES" -derivedDataPath .build/DerivedData > out/logs/build.log 2>&1
          status=$?
          grep -E "error:|BUILD" out/logs/build.log | sort -u | tail -150
          exit $status

      # Переменные TEST_RUNNER_* xcodebuild передаёт процессу тестов без приставки — только через окружение.
      - name: Тесты
        id: test
        if: matrix.part != 'ipa'
        continue-on-error: true
        run: |
          set +e
          # Симулятор — только после сборки: загрузка в фоне отнимала процессор и диск, пакеты и сборка шли в 5–10 раз дольше.
          started=$(date +%s)
          xcrun simctl boot "$UDID" > out/logs/boot.log 2>&1
          xcrun simctl bootstatus "$UDID" -b >> out/logs/boot.log 2>&1
          echo "Симулятор загрузился за $(( $(date +%s) - started )) с" | tee -a out/logs/boot.log
          TEST_RUNNER_SCREENS_DIR="$PWD/out/screens" xcodebuild test-without-building -project Aerial.xcodeproj -scheme Aerial \
            -destination "platform=iOS Simulator,id=$UDID" $ONLY \
            -clonedSourcePackagesDirPath "$PACKAGES" -derivedDataPath .build/DerivedData -parallel-testing-enabled NO \
            -resultBundlePath out/tests.xcresult > out/logs/test.log 2>&1
          status=$?
          grep -E "error:|Test Case|Executed" out/logs/test.log | tail -40
          exit $status

      - name: Итоги тестов и журналы приложения
        if: always() && matrix.part != 'ipa'
        run: |
          set +e
          if [ -d out/tests.xcresult ]; then
            # Итоги всех тестов, и Swift Testing тоже: xcodebuild их в журнал не пишет.
            xcrun xcresulttool get test-results tests --path out/tests.xcresult > out/logs/test-results.json
            python3 - out/logs/test-results.json <<'PY'
          import json, sys
          def walk(node, depth=0):
              if node.get("nodeType") in ("Test Case", "Test Suite", "Unit test bundle", "UI test bundle"):
                  print("  " * depth + f"{node.get('result', '?'):8} {node.get('name')}")
              for child in node.get("children", []):
                  walk(child, depth + 1)
          for root in json.load(open(sys.argv[1])).get("testNodes", []):
              walk(root)
          PY
          fi
          container=$(xcrun simctl get_app_container "$UDID" com.aerial.ios data 2>/dev/null)
          if [ -n "$container" ]; then
            mkdir -p out/logs/app
            cp -R "$container/Documents/logs/." out/logs/app/
            cp "$container/Documents/TorrServer/"*.log out/logs/app/
          fi
          ls -R out/screens out/logs | head -60
          exit 0

      - name: Сборка .ipa (без подписи)
        id: ipa
        if: matrix.part == 'ipa'
        run: |
          set +e
          xcodebuild archive -project Aerial.xcodeproj -scheme Aerial -configuration Release \
            -destination "generic/platform=iOS" -archivePath out/Aerial.xcarchive \
            -clonedSourcePackagesDirPath "$PACKAGES" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > out/logs/archive.log 2>&1
          status=$?
          grep -E "error:|ARCHIVE" out/logs/archive.log | sort -u | tail -150
          [ $status -eq 0 ] || exit $status
          set -e
          mkdir -p out/Payload
          cp -R out/Aerial.xcarchive/Products/Applications/Aerial.app out/Payload/
          (cd out && zip -qry Aerial.ipa Payload)
          ls -lh out/Aerial.ipa

      - uses: actions/upload-artifact@v4
        if: always() && steps.ipa.outcome == 'success'
        with:
          name: Aerial-ipa
          path: out/Aerial.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aerial-check-${{ matrix.part }}
          path: |
            out/screens
            out/logs
          retention-days: 14

      - name: Итог тестов
        if: matrix.part != 'ipa' && steps.test.outcome != 'success'
        run: |
          echo "Тесты не прошли — см. logs/test.log и logs/test-results.json в артефакте Aerial-check-$PART"
          exit 1
