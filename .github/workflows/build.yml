# Сборка без Mac: GitHub Actions (macOS 26, Xcode 26.6).
# 1) тесты и UI-снимки на симуляторе iPhone 17 Pro; 2) неподписанный Aerial.ipa для установки через Sideloadly/AltStore.
# Артефакты: Aerial-ipa (приложение), Aerial-check (снимки экранов, журналы приложения и mpv, лог сборки).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      SIM: iPhone 17 Pro
      SIM_OS: "26.5"
      PACKAGES: ${{ github.workspace }}/.build/SourcePackages
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Проект
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          mkdir -p out/screens out/logs
          printf 'TMDB_API_KEY = %s\nTMDB_READ_TOKEN = %s\n' "$TMDB_API_KEY" "$TMDB_READ_TOKEN" > Config/Secrets.xcconfig
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Кэш пакетов
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PACKAGES }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}

      - name: Пакеты (MPVKit, TorrServerKit)
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project Aerial.xcodeproj -scheme Aerial \
            -clonedSourcePackagesDirPath "$PACKAGES" 2>&1 | tee out/logs/packages.log | tail -40

      - name: Тесты и снимки
        id: test
        continue-on-error: true
        run: |
          set +e
          mkdir -p out/screens out/logs
          # Переменные TEST_RUNNER_* xcodebuild передаёт процессу тестов без приставки — только через окружение.
          TEST_RUNNER_SCREENS_DIR="$PWD/out/screens" xcodebuild test -project Aerial.xcodeproj -scheme Aerial \
            -destination "platform=iOS Simulator,name=$SIM,OS=$SIM_OS" \
            -clonedSourcePackagesDirPath "$PACKAGES" -parallel-testing-enabled NO \
            -resultBundlePath out/tests.xcresult > out/logs/test-build.log 2>&1
          status=$?
          grep -E "error:|Test (Case|Suite)|passed|failed" out/logs/test-build.log | tail -300
          exit $status

      - name: Итоги тестов, снимки и журналы приложения
        if: always()
        run: |
          set +e
          if [ -d out/tests.xcresult ]; then
            # Итоги всех тестов (и Swift Testing, которые xcodebuild в журнал не пишет) и снимки-вложения.
            xcrun xcresulttool get test-results tests --path out/tests.xcresult > out/logs/test-results.json
            xcrun xcresulttool get test-results summary --path out/tests.xcresult > out/logs/test-summary.json
            python3 - out/logs/test-results.json <<'PY'
          import json, sys
          def walk(node, depth=0):
              if node.get("nodeType") in ("Test Case", "Test Suite", "Unit test bundle", "UI test bundle"):
                  print("  " * depth + f"{node.get('result', '?'):8} {node.get('name')}")
              for child in node.get("children", []):
                  walk(child, depth + 1)
          for root in json.load(open(sys.argv[1])).get("testNodes", []):
              walk(root)
          PY
            xcrun xcresulttool export attachments --path out/tests.xcresult --output-path out/screens/attachments
          fi
          # Журналы приложения: симулятор после тестов мог выключиться — включаем, чтобы открыть контейнер.
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys,os; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in d.items() if k.endswith('iOS-' + os.environ['SIM_OS'].replace('.','-')) for x in v if x['name']==os.environ['SIM']), ''))")
          if [ -n "$udid" ]; then
            xcrun simctl boot "$udid" 2>/dev/null
            container=$(xcrun simctl get_app_container "$udid" com.aerial.ios data 2>/dev/null)
            if [ -n "$container" ]; then
              mkdir -p out/logs/app
              cp -R "$container/Documents/logs/." out/logs/app/
              cp "$container/Documents/TorrServer/"*.log out/logs/app/
            fi
          fi
          ls -R out/screens out/logs | head -60
          exit 0

      - name: Сборка .ipa (без подписи)
        id: ipa
        run: |
          set +e
          xcodebuild archive -project Aerial.xcodeproj -scheme Aerial -configuration Release \
            -destination "generic/platform=iOS" -archivePath out/Aerial.xcarchive \
            -clonedSourcePackagesDirPath "$PACKAGES" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > out/logs/archive.log 2>&1
          status=$?
          grep -E "error:|ARCHIVE" out/logs/archive.log | sort -u | tail -150
          [ $status -eq 0 ] || exit $status
          set -e
          mkdir -p out/Payload
          cp -R out/Aerial.xcarchive/Products/Applications/Aerial.app out/Payload/
          (cd out && zip -qry Aerial.ipa Payload)
          ls -lh out/Aerial.ipa

      - uses: actions/upload-artifact@v4
        if: always() && steps.ipa.outcome == 'success'
        with:
          name: Aerial-ipa
          path: out/Aerial.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aerial-check
          path: |
            out/screens
            out/logs
          retention-days: 14

      - name: Итог тестов
        if: steps.test.outcome != 'success'
        run: |
          echo "Тесты не прошли — см. out/logs/test-build.log в артефакте Aerial-check"
          exit 1
